[package]
name = "rts_assignment"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8.5"
amiquip = "0.4.2"
serde_json = "1.0.134"
serde = "1.0.216"
chrono = "0.4"
cpu-monitor = "0.1.1"
perf_monitor = "0.2.1"
cpu-time = "1.0.0"

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "generate_stock_vector_bench"
harness = false

[[bench]]
name = "add_stock_bench"
harness = false

[[bench]]
name = "deduct_stock_bench"
harness = false

[[bench]]
name = "fluctuate_price_bench"
harness = false

[lib]
name = "rts_assignment"
path = "src/lib.rs"

[[bin]]
name = "trading"
path = "src/trading/trading.rs"

[[bin]]
name = "stock"
path = "src/main.rs"


